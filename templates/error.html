{% extends "base.html" %}
{% block title %}Error {{ code }}{% endblock %}

{% block content %}
<div class="auth-page">
  <div style="text-align:center">
    <div style="font-size:4rem;font-weight:900;color:var(--lime)">{{ code }}</div>
    <h2 style="font-size:1.5rem;margin:0.5rem 0">{{ message }}</h2>
    <p style="color:var(--muted);margin-bottom:1.5rem">Let's get you back in the game.</p>
    <a href="{{ url_for('index') }}" class="btn btn-primary">Back to Home</a>
  </div>
</div>
{% endblock %}
