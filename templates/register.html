{% extends "base.html" %}
{% block title %}Sign Up{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="form-wrap">
    <div class="form-card">
      <h2>Create your account</h2>
      <p class="sub">Join Xtra Time as an organizer or a player.</p>

      <form method="POST" action="{{ url_for('register') }}" id="register-form">
        <!-- Role selector -->
        <div class="role-toggle">
          <div class="role-option selected" data-role="player" onclick="selectRole(this, 'player')">
            <div class="role-icon">⚽</div>
            <div class="role-title">Player</div>
            <div class="role-desc">Create & register teams</div>
          </div>
          <div class="role-option" data-role="organizer" onclick="selectRole(this, 'organizer')">
            <div class="role-icon">📋</div>
            <div class="role-title">Organizer</div>
            <div class="role-desc">Host tournaments</div>
          </div>
        </div>
        <input type="hidden" name="role" id="role-input" value="player">

        <div class="form-row">
          <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" class="form-control" placeholder="johndoe" required>
          </div>
          <div class="form-group">
            <label>Full Name <span class="opt">(optional)</span></label>
            <input type="text" name="full_name" class="form-control" placeholder="John Doe">
          </div>
        </div>

        <div class="form-group">
          <label>Email</label>
          <input type="email" name="email" class="form-control" placeholder="you@email.com" required>
        </div>

        <div class="form-group">
          <label>Password <span class="opt">(min 6 characters)</span></label>
          <input type="password" name="password" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg">Create Account</button>
      </form>

      <div class="auth-side">
        Already have an account? <a href="{{ url_for('login') }}">Sign in</a>
      </div>
    </div>
  </div>
</div>

<script>
function selectRole(el, role) {
  document.querySelectorAll('.role-option').forEach(o => o.classList.remove('selected'));
  el.classList.add('selected');
  document.getElementById('role-input').value = role;
}
</script>
{% endblock %}
